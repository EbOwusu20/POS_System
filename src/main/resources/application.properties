spring.application.name=pos-system
spring.datasource.url=jdbc:postgresql://localhost:5221/pos_db
spring.datasource.username=pos_user
spring.datasource.password=pos_password
# One server per machine: if startup says "port already in use", stop the other Java/Spring process first (Task Manager or: Get-NetTCPConnection -LocalPort 8080).
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Serve the existing frontend (kelpos-pro) directly
spring.web.resources.static-locations=classpath:/static/,file:../kelpos-pro/

# Paystack
paystack.secret-key=REPLACE_ME
paystack.base-url=https://api.paystack.co

# JWT (set a strong value in production via env var)
jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
jwt.expiration-ms=86400000

# Demo logins: admin/admin123, manager/manager123, cashier/cashier123 — reset every startup for testing. Set false in production.
app.ensure-demo-users=true
